modules:
  jira:issuePanel:
    - key: forewarned-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Forewarned
      icon: resource:icons;forewarned.svg
      displayConditions:
        jiraExpression: 'issue.issueType.hierarchyLevel == 1'
  rovo:agent:
    - key: forewarned-agent
      name: Forewarned
      description: Runs an evidence-based pre-mortem on a Jira epic from the team's own Jira data.
      prompt: |
        You are Forewarned, an agent that runs evidence-based pre-mortems on Jira epics.
        A pre-mortem imagines that the epic has already failed and explains why, using only facts from the team's own Jira data.

        When the user asks for a pre-mortem:
        1. Find the epic key. Use the work item the user is viewing if it is an epic; otherwise ask which epic to use.
        2. Call the get-evidence action with that epic key. If it says no evidence exists, call run-premortem, tell the user the run takes about a minute, and call get-evidence again when they ask you to continue. If it says a run is in progress, wait a moment and call get-evidence again. If it says the last run failed, tell the user why and call run-premortem only if they want to try again. For any other error, explain it and stop.
        3. Write between 2 and 5 failure reasons. Each reason has a short title, a likelihood (High, Medium or Low), a one or two sentence explanation, the IDs of the evidence items it is based on (for example ["E1", "E2"]) and a one-sentence mitigation. Copy every number, date and work item key exactly as it appears in the evidence you cite; never round, estimate or invent them. Use High only when you cite an evidence item with baseRate true.
        4. Call the submit-premortem action with the epic key, the packId from get-evidence, and the reasons as a JSON array in reasonsJson, for example [{"title": "Scope keeps growing", "likelihood": "Medium", "explanation": "...", "evidenceIds": ["E2"], "mitigation": "..."}].
        5. Tell the user how many reasons were saved, which were dropped and why, and that the saved pre-mortem appears in the Forewarned panel on the epic. If reasons were dropped, you may fix them and submit once more.

        If the evidence is too thin for a reason, say so instead of guessing.

        When the user asks what the saved pre-mortem says, call the get-premortem action and report the saved reasons with their evidence IDs instead of writing new ones.
      conversationStarters:
        - Run a pre-mortem on this epic
        - What does the saved pre-mortem say?
      actions:
        - run-premortem
        - get-evidence
        - submit-premortem
        - get-premortem
  action:
    - key: run-premortem
      name: Run pre-mortem
      function: run-premortem-fn
      actionVerb: TRIGGER
      description: |
        Starts building the evidence pack and the rule-based pre-mortem for a Jira epic in the background. Call it when get-evidence says no evidence exists. It returns at once; the run takes about a minute.
      inputs:
        epicKey:
          title: Epic key
          type: string
          required: true
          description: The key of the Jira epic, for example PLAT-1.
    - key: get-evidence
      name: Get pre-mortem evidence
      function: get-evidence-fn
      actionVerb: GET
      description: |
        Gets the evidence pack for a Jira epic: numbered facts (E1, E2, ...) from the team's Jira history on slips, scope growth, load and blockers, plus the comparison set. Call this before writing any pre-mortem reasons.
      inputs:
        epicKey:
          title: Epic key
          type: string
          required: true
          description: The key of the Jira epic, for example PLAT-1.
    - key: submit-premortem
      name: Save pre-mortem
      function: submit-premortem-fn
      actionVerb: UPDATE
      description: |
        Saves pre-mortem reasons on a Jira epic. Each reason is checked against the stored evidence: reasons that cite no valid evidence ID, quote numbers or work item keys that aren't in it, or contain links, are dropped.
      inputs:
        epicKey:
          title: Epic key
          type: string
          required: true
          description: The key of the Jira epic, for example PLAT-1.
        reasonsJson:
          title: Reasons as JSON
          type: string
          required: true
          description: 'A JSON array of 2 to 5 reasons, each with "title", "likelihood" (High, Medium or Low), "explanation", "evidenceIds" (IDs from get-evidence) and "mitigation".'
        packId:
          title: Evidence pack ID
          type: string
          required: false
          description: The packId that get-evidence returned, so the reasons are checked against the same evidence.
    - key: get-premortem
      name: Get saved pre-mortem
      function: get-premortem-fn
      actionVerb: GET
      description: |
        Gets the pre-mortem that Forewarned saved on a Jira epic: its reasons, their evidence IDs and when it was saved. Use it when the user asks what the saved pre-mortem says. It doesn't search Confluence pages.
      inputs:
        epicKey:
          title: Epic key
          type: string
          required: true
          description: The key of the Jira epic, for example PLAT-1.
  function:
    - key: resolver
      handler: index.handler
    - key: run-premortem-fn
      handler: actions/index.runPremortem
    - key: get-evidence-fn
      handler: actions/index.getEvidence
    - key: submit-premortem-fn
      handler: actions/index.submitPremortem
    - key: get-premortem-fn
      handler: actions/index.getPremortem
    # Story 003: the pre-mortem run happens here, outside the 25 s resolver and 55 s action limits.
    - key: premortem-run-fn
      handler: premortem/consumer.handler
      timeoutSeconds: 300
  consumer:
    - key: premortem-run-consumer
      queue: premortem-run
      function: premortem-run-fn
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: icons
    path: static/icons
permissions:
  # The queue consumer reads Jira as the user who started the run, through offline user
  # impersonation (story 003; story 002 open question 1). It writes only to Forge KVS (storage:app),
  # so writing to Jira needs no impersonation; write:jira-work is for the mitigation work items
  # (story 006) and the Confluence scopes for the pre-mortem page (story 007): spaces and their
  # create permission, the page's version and title check, and creating or updating it.
  scopes:
    read:jira-work:
      allowImpersonation: true
    write:jira-work: {}
    storage:app: {}
    read:space:confluence: {}
    read:page:confluence: {}
    write:page:confluence: {}
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/d25bd899-00db-4ac1-a33b-c001e7d4b41c
  compatibility:
    jira:
      required: true
    confluence:
      required: false
