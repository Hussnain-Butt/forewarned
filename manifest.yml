modules:
  jira:issuePanel:
    - key: forewarned-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: forewarned
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      displayConditions:
        jiraExpression: 'issue.issueType.hierarchyLevel == 1'
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/d25bd899-00db-4ac1-a33b-c001e7d4b41c
