modules:
  jira:issuePanel:
    - key: forewarned-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: forewarned
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      displayConditions:
        jiraExpression: 'issue.issueType.hierarchyLevel == 1'
  rovo:agent:
    - key: forewarned-agent
      name: Forewarned
      description: Runs an evidence-based pre-mortem on a Jira epic from the team's own Jira data.
      prompt: |
        You are Forewarned, an agent that runs evidence-based pre-mortems on Jira epics.
        A pre-mortem imagines that the epic has already failed and explains why, using only facts from the team's own Jira data.

        When the user asks for a pre-mortem:
        1. Find the epic key. Use the work item the user is viewing if it is an epic; otherwise ask which epic to use.
        2. Call the get-evidence action with that epic key. If it returns an error, explain the error and stop.
        3. Write between 2 and 5 failure reasons. Each reason has a short title, a one or two sentence explanation, and the IDs of the evidence items it is based on, for example ["E1", "E2"]. Only use facts and numbers that appear in the evidence. Never invent numbers, names or dates.
        4. Call the submit-premortem action with the epic key and the reasons as a JSON array in reasonsJson, for example [{"title": "Scope keeps growing", "explanation": "...", "evidenceIds": ["E2"]}].
        5. Tell the user how many reasons were saved and which were dropped, and that the saved pre-mortem appears in the Forewarned panel on the epic.

        If the evidence is too thin for a reason, say so instead of guessing.

        When the user asks what the saved pre-mortem says, call the get-premortem action and report the saved reasons with their evidence IDs instead of writing new ones.
      conversationStarters:
        - Run a pre-mortem on this epic
        - What does the saved pre-mortem say?
      actions:
        - get-evidence
        - submit-premortem
        - get-premortem
  action:
    - key: get-evidence
      name: Get pre-mortem evidence
      function: get-evidence-fn
      actionVerb: GET
      description: |
        Gets the evidence pack for a Jira epic: numbered facts (E1, E2, ...) about its due date, its child work items and its status. Call this before writing any pre-mortem reasons.
      inputs:
        epicKey:
          title: Epic key
          type: string
          required: true
          description: The key of the Jira epic, for example PLAT-1.
    - key: submit-premortem
      name: Save pre-mortem
      function: submit-premortem-fn
      actionVerb: UPDATE
      description: |
        Saves pre-mortem reasons on a Jira epic. Reasons that don't cite valid evidence IDs from get-evidence are dropped.
      inputs:
        epicKey:
          title: Epic key
          type: string
          required: true
          description: The key of the Jira epic, for example PLAT-1.
        reasonsJson:
          title: Reasons as JSON
          type: string
          required: true
          description: 'A JSON array of 2 to 5 reasons, each with "title", "explanation" and "evidenceIds" (IDs from get-evidence).'
    - key: get-premortem
      name: Get saved pre-mortem
      function: get-premortem-fn
      actionVerb: GET
      description: |
        Gets the pre-mortem that Forewarned saved on a Jira epic: its reasons, their evidence IDs and when it was saved. Use it when the user asks what the saved pre-mortem says. It doesn't search Confluence pages.
      inputs:
        epicKey:
          title: Epic key
          type: string
          required: true
          description: The key of the Jira epic, for example PLAT-1.
  function:
    - key: resolver
      handler: index.handler
    - key: get-evidence-fn
      handler: actions/index.getEvidence
    - key: submit-premortem-fn
      handler: actions/index.submitPremortem
    - key: get-premortem-fn
      handler: actions/index.getPremortem
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/d25bd899-00db-4ac1-a33b-c001e7d4b41c
